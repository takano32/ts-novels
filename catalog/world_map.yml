# シェアワールド (ts_world) の判定規則。
# boards = 共有感想板の slug / path_prefixes = 作品ディレクトリ /
# title_patterns = 題名の正規表現 (板もディレクトリも無い世界の最終手段)。
# 原資料: share_world.html・share_world.htm・~ts/kansou/bbs@log_.cgi
worlds:
  2daime:
    boards:
    - 2daime
    name: 二代目シリーズ
    path_prefixes: []
  delayed:
