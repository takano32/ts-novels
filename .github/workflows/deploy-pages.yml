name: Deploy to GitHub Pages

# ts.novels.jp（少年少女文庫）復元ミラーを GitHub Pages に公開する。
# 静的ファイルのみなのでビルド不要。公式の Artifact 方式でリポジトリ直下を配信する。
#
# 事前設定（リポジトリ初回のみ）:
#   Settings > Pages > Build and deployment > Source を "GitHub Actions" に変更する。

on:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN に Pages デプロイ用の権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数走らせない。進行中のデプロイは完了させる（公開の取りこぼし防止）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # リポジトリ直下に index.html / novel/ などが並ぶのでルートをそのまま配信
          # (.git と .github は action がデフォルトで除外する)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
