<SCRIPT TYPE="text/javascript" LANGUAGE="JavaScript">
<!--

function callServer(){
	if(document.SendData.status.value == 'new'){
		document.SendData.nickname.value =  document.PrintName.printnickname.value;
	}
	document.SendData.speaks.value = document.ChatData.inputSpeaks.value ;
	document.ChatData.inputSpeaks.value = "" ;
	document.SendData.chatcolor.value = document.PrintName.ChatColor.value ;
	document.SendData.submit() ;
}


function changeName(){
	if (document.SendData.status.value != 'in') {
		 document.SendData.nickname.value =  document.PrintName.printnickname.value;
		 return ;
	}
	var oldName = document.SendData.nickname.value ;
	var tempName =  document.PrintName.printnickname.value ;
	if (tempName == "" || tempName == null) {
		tempName = oldName ;
		return ;
	}
	if (tempName != oldName) {
		if (document.SendData.status.value == 'in') {
			document.SendData.speaks.value = tempName ;
			document.SendData.status.value = 'rename' ;
			document.SendData.submit() ;
		}
	}
	document.ChatData.inputSpeaks.focus() ;
}

function clearState(){
	document.SendData.status.value = 'new' ;
}

function logoutChat(){
	if (document.SendData.status.value == 'in') {
		document.SendData.speaks.value = "" ;
		document.SendData.status.value = 'out' ;
		document.SendData.submit() ;
	}
}

function clearLog(){
		document.ChatData.ChatLog.value = "" ;
		parent.ChatMain.document.all.ChatBox.innerHTML = "" ;
}


function copyLog(type) {
	if(navigator.appName.charAt(0) == "M"){
		if(type == "Source") {
			document.ChatData.LogBox.value = document.all.ChatBox.innerHTML ;
		}
		else if(type == "Text") {
			document.ChatData.LogBox.value = document.all.ChatBox.innerText ;
		}
		logRange = document.ChatData.LogBox.createTextRange() ;
		logRange.execCommand("Copy");
	}
}

//-->
