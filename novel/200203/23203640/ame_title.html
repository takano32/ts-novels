<p style="line-height:150%;margin:2em 10%;">
藤咲雨は希望ヶ丘高校に通う高校一年生。<br>
秋雨が降り続き、そろそろ文化祭が間近に迫ってきた頃、うたた寝から目を覚ました雨はあることに気づく。<br><br>

……20年後にタイムスリップし、佐々木時雨という二児の母になっていた自分に。
</p>
