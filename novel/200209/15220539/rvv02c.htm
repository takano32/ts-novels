<P><B><BR>
<BR>
<BR>
　－ＮＲＴ－<BR>
<BR>
<BR>
<BR>
「ギ」<BR>
<BR>
　金切り声が、静かな夜の街に木霊する。<BR>
　人は、気が付かない。<BR>
　あるいは、気が付かない振りをしているだけなのかもしれない。<BR>
　しかし、その姿を見ても、誰一人、声を上げるものはいなかった。<BR>
<BR>
　なぜなら、声を上げる暇もなく、その餌食となっているからである。<BR>
<BR>
　その、螳螂ともとれる姿のクリーチャーは、静かな街を闊歩していた。<BR>
<BR>
<BR>
</B></P>
