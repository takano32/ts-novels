<h2>作: <a href="mailto:plantain@r5.dion.ne.jp">Plantain</a></h2>
<div class="box">
<h3>あらまし</h3>
<p>
　地球から一四四光年離れたレヴァという惑星から来た第五王子様メイは、なぜか地球人の少女の格好をしていた。<br>
　平凡な中学二年帰宅部男子ことユイの運命の輪は、メイと出会った瞬間から回りすぎるほど回り始めたのだった。<br>
</p>
